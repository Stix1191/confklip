# This file contains common pin mappings for the BIGTREETECH SKR V1.3
# board. To use this config, the firmware should be compiled for the
# LPC1768.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: P1.29  # P1.28 for X-max
position_endstop: 1
position_max: 197
homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: P1.26  # P1.26 for Y-max
position_endstop: 199
position_min: 0
position_max: 199
homing_speed: 50

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 20
endstop_pin: probe:z_virtual_endstop #endstop_pin: P1.24  # P1.24 for Z-max
position_min: -5.0
position_max: 199
homing_positive_dir: false



[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 23.2
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
control: pid
pid_Kp: 32.708
pid_Ki: 2.907
pid_Kd: 91.990
min_temp: 0
max_temp: 260

#[extruder1]
#step_pin: P0.1
#dir_pin: P0.0
#enable_pin: !P0.10
#heater_pin: P2.4
#sensor_pin: P0.25
#...

[heater_bed]
heater_pin: P2.5
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.23
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_0F130B0B0B104D53C4EA144E060000F5-if00

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 25
max_z_accel: 100

[autotune_tmc stepper_x]
motor: usongshine-17HS8401
tuning_goal: silent
voltage: 24.0
pwm_freq_target: 30000
toff: 1

[autotune_tmc stepper_y]
motor: usongshine-17HS8401
tuning_goal: silent
voltage: 24.0
pwm_freq_target: 30000
toff: 1


########################################
# TMC2208 configuration
########################################

# For TMC2208 UART
#   1) Remove all of the jumpers below the stepper drivers
#   2) Place jumpers on the red pin headers labeled XUART (XUART, YUART etc.)

[tmc2209 stepper_x]
uart_pin: P1.17
run_current: 0.900
interpolate: True

[tmc2209 stepper_y]
uart_pin: P1.15
run_current: 0.900
interpolate: True

[tmc2209 stepper_z]
uart_pin: P1.10
run_current: 0.650
#stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: P1.8
run_current: 0.50
#stealthchop_threshold: 999999

#[tmc2208 extruder1]
#uart_pin: P1.1
run_current: 0.800
#stealthchop_threshold: 999999


