[bltouch]
sensor_pin: ^P1.25
control_pin: P2.0
# Смещения датчика относительно сопла (измерьте свои реальные значения в мм!)
x_offset: 0
y_offset: 40
z_offset: 3.291
speed: 5.0
samples: 2
samples_tolerance: 0.3
pin_move_time: 0.680
#samples_retract_dist: 3.0
# Для некоторых клонов BLTouch может потребоваться раскомментировать строчку ниже:
# pin_up_touch_mode_reports_triggered: False
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False
probe_with_touch_mode: True

[force_move]
enable_force_move: True

[homing_override]
axes: Z
gcode:
   SET_KINEMATIC_POSITION Z=0
    G28 X Y
    G0 X100 Y100 F5000
    G28 Z
    G0 Z10 F500
    BLTOUCH_DEBUG COMMAND=pin_down

[bed_mesh]
speed: 50
horizontal_move_z: 7
mesh_min: 10, 40
mesh_max: 185, 185
probe_count: 4, 4
